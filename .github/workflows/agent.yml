# L'agent du soir : met à jour l'indice AgentBourse (argent fictif) et enregistre les résultats dans le dépôt.
name: Agent du soir

on:
  schedule:
    - cron: "30 22 * * 1-5"   # du lundi au vendredi, 22 h 30 UTC (après la fermeture de Wall Street)
  workflow_dispatch:          # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write             # pour enregistrer les résultats dans le dépôt

concurrency:
  group: agent-du-soir
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install yfinance==1.8.0 pandas
      - run: python agent_quotidien.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indice
          git diff --cached --quiet || git commit -m "Agent du soir : $(date +%F)"
          git push
